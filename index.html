<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Money</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <script src="./scripts.js" defer></script>
</head>

<body>
    <img class="logo" src="./assets/logo.gif" alt="logo-devclub-convert-money">

    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>

        </label>

        <label>
            Converter <b>para</b>
            <select class="currency-select">
                <option value="dolar">US$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">€ Libra</option>
                <option value="bitcoin">₿ Bitcoin</option>
            </select>

        </label>

        <label>
            Valor
            <input class="currency-input" placeholder=" R$ 10.000.00">
    </label>

    <button class="convert-button">Converter</button>

    <section>
        <div class="currency-box">
            <img class="brasil-logo" src="./assets/fcf15cc7ea5a0aa77537e7939a6742b588d600a6.png" alt="logo-moeda-a-converter">
            <p class="currency-name">Real</p>
            <P class="currency-value-to-convert">R$ 0,00</P>
        </div>

        <img class="arrow-img" src="./assets/arrow.png" alt="seta">

        <div class="currency-box">
            <img class="currency-img" src="./assets/estados-unidos (1) 1.png" alt="logo-moeda-covertida">
            <p class="currency-name" id="currency-name">Dólar</p>
            <P class="currency-value">US$ 0,00</P>
        </div>
    </section>
    </main>
</body>

</html>
